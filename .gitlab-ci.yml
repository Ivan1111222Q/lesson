stages:
  - test
  - build

claster-connection:
  stage: test
  image: alpine:latest
  before_script:
    - echo "🔧 Установка kubectl..."
    - apk add --no-cache curl
    - |
      KUBECTL_VERSION=$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)
      curl -LO "https://storage.googleapis.com/kubernetes-release/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      chmod +x kubectl
      mv kubectl /usr/local/bin/kubectl
    - echo "✅ kubectl установлен"
    - kubectl version --client
  script:
    - echo "=== СОЗДАНИЕ KUBECONFIG ==="
    - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig.yaml
    
    - echo "=== ТЕСТ ПОДКЛЮЧЕНИЯ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml cluster-info
    
    - echo "=== ИНФОРМАЦИЯ О КЛАСТЕРЕ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get nodes
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get namespaces

    - echo "=== КОНТЕКСТЫ KUBERNETES ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml config get-contexts
    - |
      # Используем текущий контекст (уже выбран gitlab-context)
      CURRENT_CONTEXT=$(kubectl --kubeconfig=/tmp/kubeconfig.yaml config current-context)
      echo "✅ Текущий контекст: $CURRENT_CONTEXT"
    
    - echo "✅ ТЕСТ ПРОЙДЕН УСПЕШНО!"

deploy-docker:
  stage: build
  image: docker:20.10.17
  services:
    - docker:20.10.17-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "🚀 ПРОВЕРКА DOCKER"
    - docker --version
    - docker info
    - echo "✅ Docker готов к использованию"

deploy-helm:
  stage: build
  image: alpine/helm:3.13.0
  script:
    - echo "🚀 ПРОВЕРКА HELM"
    - helm version
    - echo "✅ Helm готов к использованию"

deploy:
  stage: build
  script:
    - echo "🚀 УСТАНОВКА ПРИЛОЖЕНИЙ"
    - python3 test2.py
    - echo "Тесты прошли"