stages:
  - test

test-connection:
  stage: test
  image: bitnami/kubectl:latest
  script:
    # 1. Создаем файл из переменной
    - echo "=== СОЗДАНИЕ KUBECONFIG ==="
    - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig.yaml
    
    # 2. Проверяем файл
    - echo "Размер файла: $(wc -c < /tmp/kubeconfig.yaml) байт"
    - echo "Первые 3 строки:"
    - head -3 /tmp/kubeconfig.yaml
    
    # 3. Тестируем подключение
    - echo "=== ТЕСТ ПОДКЛЮЧЕНИЯ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml cluster-info
    
    # 4. Получаем информацию о кластере
    - echo "=== ИНФОРМАЦИЯ О КЛАСТЕРЕ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get nodes
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get namespaces
    
    # 5. Очистка
    - rm -f /tmp/kubeconfig.yaml
    - echo "✅ ТЕСТ ПРОЙДЕН УСПЕШНО!"