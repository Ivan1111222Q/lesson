stages:
  - test
  - build
  - deploy

unit-test:
  stage: test
  script:
    - echo "Запускаем тесты"
    - sleep 60
    - echo "Тесты прошли"

lint-check:
  stage: test
  script:
    - echo "Начинаем валидацию"
    - sleep 30
    - echo "Валидация пройдена"


build-job:
  stage: build
  script:
    - echo "Сборка"
    - sleep 30
    - echo "Сборка прошла"

deploy-job:
  stage: deploy
  script:
    - echo "Запуск теста"
    - sleep 60
    - echo "Тесты прошли успешно"


