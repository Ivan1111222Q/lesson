build:
  stage: build
  image: docker:24.0
  tags: ["docker"]
  services:
    - docker:24.0-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
  script:
   - cat "${SERVICE_ACCOUNT_KEY_JSON}" | docker login --username json_key --password-stdin cr.yandex
   - |
     for service in frontend users orders products reviews; do
       REGISTRY_URL="${REGISTRY}/${REGISTRY_ID}/${service}-service:${CI_COMMIT_SHORT_SHA}"
       echo "Building $service..."
       cd ${service}-service
       docker build -t "$REGISTRY_URL" .
       docker push "$REGISTRY_URL"
       cd ..
       echo "$service done"
     done


