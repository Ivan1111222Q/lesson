stages:
  - test
  - build
  - deploy

# =============================================================================
# TEST STAGE
# =============================================================================

test-connection:
  stage: test
  image: bitnami/kubectl:latest
  before_script:
    - echo "=== ТЕСТ ПОДКЛЮЧЕНИЯ ==="
    - echo "🔧 Настройк kubeconfig..."
    - |
      # Создание kubeconfig из переменной окружения
      mkdir -p ~/.kube
      if [ -n "$KUBECONFIG_BASE64" ]; then
        echo "📝 Создание kubeconfig из переменной KUBECONFIG_BASE64"
        echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
      elif [ -n "$KUBECONFIG" ]; then
        echo "📝 Использование переменной KUBECONFIG"
        echo "$KUBECONFIG" > ~/.kube/config
        chmod 600 ~/.kube/config
      elif [ -n "$KUBECONFIG_CONTENT" ]; then
        echo "📝 Использование переменной KUBECONFIG_CONTENT"
        echo "$KUBECONFIG_CONTENT" > ~/.kube/config
        chmod 600 ~/.kube/config
      else
        echo ""
        echo "❌ ОШИБКА: Переменные окружения для подключения к кластеру не установлены!"
        echo ""
        echo "📝 ИНСТРУКЦИЯ ПО НАСТРОЙКЕ:"
        echo ""
        echo "1. Перейдите в GitLab: Settings → CI/CD → Variables"
        echo "2. Добавьте одну из следующих переменных:"
        echo ""
        echo "   Вариант A (рекомендуется):"
        echo "   - Key: KUBECONFIG_BASE64"
        echo "   - Value: ваш kubeconfig, закодированный в base64"
        echo "   - Type: Variable"
        echo "   - Protected: ✅"
        echo "   - Masked: ❌"
        echo ""
        echo "   Как получить:"
        echo "   $ yc managed-kubernetes cluster get-credentials --id <cluster-id> --external"
        echo "   $ cat ~/.kube/config | base64 -w 0"
        echo ""
        echo "   Вариант B:"
        echo "   - Key: KUBECONFIG"
        echo "   - Value: содержимое вашего kubeconfig файла"
        echo "   - Type: Variable"
        echo "   - Protected: ✅"
        echo "   - Masked: ❌"
        echo ""
        echo "   Вариант C (для обратной совместимости):"
        echo "   - Key: KUBECONFIG_CONTENT"
        echo "   - Value: содержимое вашего kubeconfig файла"
        echo ""
        echo "📚 Подробная документация: см. файл GITLAB_CI_SETUP.md"
        echo ""
        exit 1
      fi
    - echo "✅ Kubeconfig файл создан"
    - kubectl version --client
  script:
    - echo "🔍 Проверка подключения к кластеру..."
    - kubectl cluster-info --request-timeout=30s
    - echo ""
    - echo "📋 Получение списка узлов..."
    - kubectl get nodes
    - echo ""
    - echo "📊 Получение информации о кластере..."
    - kubectl get namespaces
    - echo ""
    - echo "✅ Тест подключения пройден успешно!"