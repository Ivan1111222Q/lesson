stages:
  - test
  - build

claster-connection:
  stage: test
  image: bitnami/kubectl:latest
  before_script:
    - |
      # Проверяем, установлен ли kubectl
      if ! command -v kubectl &> /dev/null; then
        echo "📦 Устанавливаю kubectl..."
        # Для Alpine
        if [ -f /etc/alpine-release ]; then
          apk add --no-cache curl
          KUBECTL_VERSION=$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/
        else
          # Для других дистрибутивов
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/ || mv kubectl /usr/local/bin/
        fi
      fi
    - echo "🔧 Проверка kubectl..."
    - kubectl version --client
  script:
    - echo "=== СОЗДАНИЕ KUBECONFIG ==="
    - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig.yaml
    
    - echo "=== ТЕСТ ПОДКЛЮЧЕНИЯ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml cluster-info
    
    - echo "=== ИНФОРМАЦИЯ О КЛАСТЕРЕ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get nodes
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get namespaces

    - kubectl config get-contexts
    - kubectl config use-context yc-lesson
    - kubectl config get-contexts
    
    - echo "✅ ТЕСТ ПРОЙДЕН УСПЕШНО!"

deplou-docker:
  stage: build
  image: docker:20.10.17
  script:
    - echo "🚀 УСТАНОВКА DOCKER"
    - docker version
    - echo "✅ Docker готов к использованию"

deploy-helm:
  stage: build
  image: alpine/helm:3.13.0
  script:
    - echo "🚀 ПРОВЕРКА HELM"
    - helm version
    - echo "✅ Helm готов к использованию"

deploy:
  stage: build
  script:
    - echo "🚀 УСТАНОВКА ПРИЛОЖЕНИЙ"
    - python3 test2.py
    - echo "Тесты прошли"