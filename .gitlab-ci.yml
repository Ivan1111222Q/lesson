stages:
  - test
  - build
  - deploy

image: bitnami/kubectl:latest

variables:
  APP_NAME: "myapp"
  NAMESPACE: "production"

before_script:
  # 0. ОТЛАДКА: Что у нас есть?
  - echo "=== НАЧАЛО ОТЛАДКИ ==="
  - echo "Текущая директория: $(pwd)"
  - echo "KUBECONFIG переменная до: $KUBECONFIG"
  
  # 1. Проверяем переменную KUBECONFIG_CONTENT
  - echo "=== ПРОВЕРКА KUBECONFIG_CONTENT ==="
  - echo "Длина переменной: ${#KUBECONFIG_CONTENT} символов"
  
  # Показываем первые 200 символов (безопасно)
  - echo "Первые 200 символов KUBECONFIG_CONTENT:"
  - echo "${KUBECONFIG_CONTENT:0:200}"
  
  # 2. Сохраняем во временный файл
  - echo "=== СОЗДАНИЕ KUBECONFIG ФАЙЛА ==="
  - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig.yaml
  
  # 3. Проверяем что файл создан
  - echo "Содержимое /tmp/kubeconfig.yaml (первые 10 строк):"
  - head -10 /tmp/kubeconfig.yaml
  
  # 4. Устанавливаем KUBECONFIG
  - export KUBECONFIG=/tmp/kubeconfig.yaml
  - echo "KUBECONFIG установлен в: $KUBECONFIG"
  
  # 5. Проверяем домашнюю директорию (пусто!)
  - echo "=== ПРОВЕРКА ~/.kube/config ==="
  - ls -la ~/.kube/ 2>/dev/null || echo "Директория ~/.kube/ не существует"
  - cat ~/.kube/config 2>/dev/null || echo "Файл ~/.kube/config не существует"
  
  # 6. Проверяем что kubectl видит наш конфиг
  - echo "=== ЧТО ВИДИТ KUBECTL? ==="
  - kubectl config view --minify
  
  # 7. Пробуем подключиться (с таймаутом)
  - echo "=== ПРОБУЕМ ПОДКЛЮЧИТЬСЯ ==="
  - timeout 10 kubectl cluster-info 2>&1 || echo "⚠️ Таймаут подключения"
  - echo "=== ОТЛАДКА ЗАВЕРШЕНА ==="

# Тестовая job
unit-test:
  stage: test
  script:
    - echo "=== START unit-test ==="
    # ЯВНО указываем путь к конфигу
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get nodes 2>&1 || echo "❌ Ошибка"
    - echo "=== END unit-test ==="