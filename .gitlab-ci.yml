stages:
  - test
  - build
  - deploy

image: bitnami/kubectl:latest  # Просто образ с kubectl

variables:
  APP_NAME: "myapp"
  NAMESPACE: "production"

before_script:
  # 1. СОЗДАЁМ KUBECONFIG ИЗ ПЕРЕМЕННОЙ
  - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig.yaml
  - export KUBECONFIG=/tmp/kubeconfig.yaml
  
  # 2. ПРОВЕРЯЕМ ПОДКЛЮЧЕНИЕ (это ВСЁ!)
  - kubectl cluster-info
  - kubectl get nodes
  - echo "✅ Подключились к кластеру!"

# Теперь ВЕЗДЕ доступен kubectl к твоему кластеру
unit-test:
  stage: test
  script:
    - echo "Запускаем тесты"
    - kubectl get pods -A  # Проверяем что доступ есть
    # - python3 test2.py

lint-check:
  stage: test
  script:
    - echo "Проверка конфигурации кластера"
    - kubectl get namespaces
    - kubectl get nodes -o wide

