stages:
  - test

test-connection:
  stage: test
  image: bitnami/kubectl:latest
  script:
    # 1. Создаем kubeconfig
    - echo "Создаю kubeconfig из переменной..."
    - echo "$KUBECONFIG_CONTENT" > /tmp/config
    
    # 2. Проверяем
    - echo "Проверяю файл..."
    - ls -la /tmp/config
    - echo "Строк в файле: $(wc -l < /tmp/config)"
    
    # 3. Подключаемся
    - echo "Пробую подключиться..."
    - KUBECONFIG=/tmp/config kubectl cluster-info --request-timeout=30s
    
    # 4. Получаем nodes
    - echo "Получаю список узлов..."
    - KUBECONFIG=/tmp/config kubectl get nodes
    
    # 5. Очистка
    - rm -f /tmp/config
    - echo "✅ Тест завершен!"