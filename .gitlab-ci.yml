stages:
  - test
  - build

claster-connection:
  stage: test
  script:
    - echo "=== СОЗДАНИЕ KUBECONFIG ==="
    - echo "$KUBECONFIG_CONTENT" > /tmp/kubeconfig.yaml
    
    - echo "=== ТЕСТ ПОДКЛЮЧЕНИЯ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml cluster-info
    
    - echo "=== ИНФОРМАЦИЯ О КЛАСТЕРЕ ==="
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get nodes
    - kubectl --kubeconfig=/tmp/kubeconfig.yaml get namespaces

    - kubectl config get-contexts
    - kubectl config use-context yc-lesson
    - kubectl config get-contexts
    
    - echo "✅ ТЕСТ ПРОЙДЕН УСПЕШНО!"

deploy-helm:
  stage: build
  script:
    - echo "🚀 УСТАНОВКА HELM БЕЗ SUDO"
    
    # Устанавливаем Helm без sudo
    - mkdir -p ~/.local/bin
    - curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    - chmod 700 get_helm.sh
    - ./get_helm.sh --no-sudo
    
    # Добавляем в PATH
    - export PATH="$HOME/.local/bin:$PATH"
    - echo "PATH добавлен: $PATH"

deploy:
  stage: build
  script:
    - echo "🚀 УСТАНОВКА ПРИЛОЖЕНИЙ"
    - python3 test2.py
    - echo "Тесты прошли"