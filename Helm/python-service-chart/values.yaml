# =============================================================================
# УНИВЕРСАЛЬНЫЙ ЧАРТ ДЛЯ PYTHON СЕРВИСОВ
# =============================================================================
# Использование:
#   helm install <release-name> ./python-service-chart -f values/<service>.yaml
#
# Пример:
#   helm install orders ./python-service-chart -f values/orders-service.yaml
# =============================================================================

# Имя сервиса (ОБЯЗАТЕЛЬНО переопределить в values/<service>.yaml)
serviceName: my-service

# Namespace для деплоя
namespace: default

# =============================================================================
# IMAGE
# =============================================================================
image:
  repository: my-registry/my-service
  tag: "latest"

# =============================================================================
# REPLICAS
# =============================================================================
replicaCount: 1

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  # nodePort: 30000  # Только для type: NodePort

# =============================================================================
# CONFIG (переменные окружения через ConfigMap)
# =============================================================================
config: {}
  # PORT: "8000"
  # LOG_LEVEL: "INFO"

# =============================================================================
# SECRET (TODO: создать templates/secret.yaml)
# =============================================================================
secret: {}
  # DB_PASSWORD: "password"

# =============================================================================
# CANARY STRATEGY (для Argo Rollouts)
# =============================================================================
strategy:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }

