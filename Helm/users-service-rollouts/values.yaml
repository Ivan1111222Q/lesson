# Общие настройки
namespace: lesson4356
image:
  repository: cr.yandex/crpiqtsurn6alildl4cb/users-service
  tag: "2.17"

# Конфигурация Deployment
replicaCount: 4

service:
  type: NodePort
  port: 8003
  targetPort: 8003
  nodePort: 30003

ports:
- name: http-metrics      # ← Имя порта для ServiceMonitor
  port: 8003
  targetPort: 8003
  protocol: TCP
  nodePort: 30003

# Настройки приложения
config:
  ORDERS_SERVICE_URL: "http://orders-service-service:8002"
  REVIEWS_SERVICE_URL: "http://reviews-service-service:8004"
  PORT: "8003"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"


secret:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "reviews"

# Ресурсы
resources:
  requests:
    memory: "128Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

# Probes
livenessProbe:
  path: /live
  port: 8003
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /ready
  port: 8003
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
  enabled: false

# Canary стратегия
strategy:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }
      - setWeight: 80
      - pause: { duration: 30s }
