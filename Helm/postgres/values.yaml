# Default values for postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

enabled: true
replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  versionOverride: "15.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
terminationGracePeriodSeconds: 10

environmentVariables:
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: reviews
  # PGDATA будет установлен автоматически из volume.mountPath


serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podAnnotations: {}

podSecurityContext:
  fsGroup: 0
  # fsGroup: 2000  # Можно использовать 999 (postgres user), но 0 работает для root

securityContext:
  runAsUser: 0
  # fsGroup должен быть в podSecurityContext, а не в securityContext контейнера
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true

service:
  type: ClusterIP
  port: 5432
  annotations: {}
  headless:
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    - host: postgres.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: postgres-tls
  #    hosts:
  #      - postgres.local

resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 2000m

nodeSelector: {}

tolerations: []

affinity: {}

volume:
  enabled: true
  className: ""
  size: 3Gi
  mountPath: /var/lib/postgresql/data
  subPath: "pgdata"

tests:
  enabled: true

livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

