image:
  repository: cr.yandex/crpiqtsurn6alildl4cb/frontend-service
  tag: '2.12'

livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 15
  path: /health
  periodSeconds: 5
  port: 80
  timeoutSeconds: 2

namespace: lesson4356
prometheusScrape: false

readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 10
  path: /health
  periodSeconds: 3
  port: 80
  timeoutSeconds: 2

replicaCount: 2

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

service:
  nodePort: 30008
  port: 80
  targetPort: 80
  type: NodePort

# Canary стратегия с проверкой 5xx ошибок
# Использует общий AnalysisTemplate "success-rate-analysis" из services-rollout
strategy:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: success-rate-analysis
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: success-rate-analysis
      - setWeight: 80
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: success-rate-analysis

# ============================================================================
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ
# ============================================================================

# ============================================================================
# ANALYSIS - настройки проверки здоровья при canary deployment
# ============================================================================
analysis:
  # Включить/выключить создание AnalysisTemplate
  enabled: true

  # Адрес Prometheus сервера
  prometheusAddress: "http://prometheus.lesson4356.svc.cluster.local:9090"

  # Порог успешности (0.99 = 99% запросов без 5xx ошибок)
  successThreshold: 0.99

  # Сколько провалов допускается перед rollback
  failureLimit: 3

  # Интервал между проверками
  interval: 30s

  # Количество проверок на каждом шаге canary
  # (3 проверки × 30s = 90 секунд анализа на каждом шаге)
  count: 3

# ============================================================================
# НАСТРОЙКИ СЕРВИСОВ
# ============================================================================        