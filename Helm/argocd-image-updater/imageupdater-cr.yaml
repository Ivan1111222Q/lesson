apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: applications-with-annotations
  namespace: argo-cd
spec:
  # Namespace, где находятся ArgoCD Applications
  namespace: argo-cd
  
  # Глобальные настройки обновления
  commonUpdateSettings:
    updateStrategy: newest-build  # Используем newest-build вместо latest (latest устарел)
  
  # Настройки записи обратно (write-back)
  writeBackConfig:
    method: argocd  # Используем ArgoCD API для обновления
  
  # Список ссылок на Applications
  applicationRefs:
    # Frontend service
    - namePattern: frontend-service
      images:
        - alias: frontend
          imageName: cr.yandex/crpiqtsurn6alildl4cb/frontend-service
    # Orders service
    - namePattern: orders-service
      images:
        - alias: orders
          imageName: cr.yandex/crpiqtsurn6alildl4cb/orders-service
    # Products service
    - namePattern: products-service
      images:
        - alias: products
          imageName: cr.yandex/crpiqtsurn6alildl4cb/products-service
    # Reviews service
    - namePattern: reviews-service
      images:
        - alias: reviews
          imageName: cr.yandex/crpiqtsurn6alildl4cb/reviews-service
    # Users service
    - namePattern: users-service
      images:
        - alias: users
          imageName: cr.yandex/crpiqtsurn6alildl4cb/users-service

