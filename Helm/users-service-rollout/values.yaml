# Общие настройки
namespace: lesson4356
image:
  repository: cr.yandex/crpiqtsurn6alildl4cb/users-service
  tag: "2.23"

# Конфигурация Deployment
replicaCount: 2

service:
  type: NodePort
  port: 8003
  targetPort: 8003
  nodePort: 30003

ports:
- name: http-metrics      # ← Имя порта для ServiceMonitor
  port: 8003
  targetPort: 8003
  protocol: TCP
  nodePort: 30003

# Настройки приложения
config:
  ORDERS_SERVICE_URL: "http://orders-service-service:8002"
  REVIEWS_SERVICE_URL: "http://reviews-service-service:8004"
  PORT: "8003"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"


secret:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "reviews"

# Ресурсы
resources:
  requests:
    memory: "128Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

# Probes
livenessProbe:
  path: /live
  port: 8003
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /ready
  port: 8003
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
  enabled: false

# Canary стратегия с проверкой 5xx ошибок
# Использует общий AnalysisTemplate "success-rate-analysis" из services-rollout
strategy:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: success-rate-analysis
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: success-rate-analysis
      - setWeight: 80
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: success-rate-analysis

# ============================================================================
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ
# ============================================================================

# ============================================================================
# ANALYSIS - настройки проверки здоровья при canary deployment
# ============================================================================
analysis:
  # Включить/выключить создание AnalysisTemplate
  enabled: true

  # Адрес Prometheus сервера
  prometheusAddress: "http://prometheus.lesson4356.svc.cluster.local:9090"

  # Порог успешности (0.99 = 99% запросов без 5xx ошибок)
  successThreshold: 0.99

  # Сколько провалов допускается перед rollback
  failureLimit: 3

  # Интервал между проверками
  interval: 30s

  # Количество проверок на каждом шаге canary
  # (3 проверки × 30s = 90 секунд анализа на каждом шаге)
  count: 3

# ============================================================================
# НАСТРОЙКИ СЕРВИСОВ
# ============================================================================            
