## Минимальная конфигурация GitLab Runner для CI/CD
## Для работы нужен GitLab сервер (URL и токен регистрации)

## URL GitLab сервера (замените на свой)
## Если используете gitlab.com, оставьте как есть
gitlabUrl: http://gitlab-webservice-default.lesson4356.svc.cluster.local:8080

## Токен регистрации Runner
## Получите его в GitLab: Settings -> CI/CD -> Runners -> New instance runner
## Или создайте секрет: kubectl create secret generic gitlab-runner-secret --from-literal=runner-registration-token=YOUR_TOKEN
runnerToken: "glrt-8pxcQLEIvszWrciTtxtkom86MQp0OjEKdToxCw.01.121u7mm75"

## RBAC для работы с Kubernetes
rbac:
  create: true
  clusterWideAccess: true
  rules:
    - resources: ["pods"]
      verbs: ["list", "get", "watch", "create", "delete", "patch"]
    - resources: ["pods/exec"]
      verbs: ["create"]
    - resources: ["pods/log"]
      verbs: ["get", "list"]
    - resources: ["pods/attach"]
      verbs: ["list", "get", "create", "delete"]
    - resources: ["secrets"]
      verbs: ["get", "list"]
    - resources: ["configmaps"]
      verbs: ["get", "list", "create", "update", "delete"]

## Конфигурация Runner
runners:
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{ .Release.Namespace }}"
        image = "alpine:latest"
        privileged = false
        cpu_limit = "1"
        memory_limit = "2Gi"
        cpu_request = "100m"
        memory_request = "128Mi"
        service_cpu_limit = "1"
        service_memory_limit = "1Gi"
        service_cpu_request = "50m"
        service_memory_request = "64Mi"
        helper_cpu_limit = "500m"
        helper_memory_limit = "100Mi"
        helper_cpu_request = "50m"
        helper_memory_request = "32Mi"

## Ресурсы для Runner
resources:
  limits:
    memory: "256Mi"
    cpu: "200m"
  requests:
    memory: "128Mi"
    cpu: "100m"

## Отключить Istio injection для Runner
podAnnotations:
  sidecar.istio.io/inject: "false"

## Количество реплик Runner
replicas: 1

## Метрики для мониторинга
metrics:
  enabled: true
  port: 9252

