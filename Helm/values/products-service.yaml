# =============================================================================
# VALUES ДЛЯ PRODUCTS-SERVICE
# =============================================================================
# Использование:
#   helm install products ../python-service-chart -f products-service.yaml
#
# Сравни этот файл с orders-service.yaml и users-service.yaml
# Обрати внимание что отличается только:
#   - serviceName
#   - image.repository и image.tag
#   - порты (port, targetPort, nodePort)
#   - config (специфичные для сервиса переменные)
# =============================================================================

serviceName: products-service
namespace: lesson4356

image:
  repository: cr.yandex/crpiqtsurn6alildl4cb/products-service
  tag: "2.13"

replicaCount: 2

service:
  type: NodePort
  port: 8001
  targetPort: 8001
  nodePort: 30001

ports:
- name: http-metrics      # ← Имя порта для ServiceMonitor
  port: 8001
  targetPort: 8001
  protocol: TCP
  nodePort: 30001  

config:
  ORDERS_SERVICE_URL: "http://orders-service-service:8002"
  PORT: "8001"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

# TODO: раскомментировать после создания secret.yaml
secret:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "reviews"

strategy:
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: "{{ .Release.Name }}-success-rate-analysis"
      - setWeight: 50
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: "{{ .Release.Name }}-success-rate-analysis"
      - setWeight: 80
      - pause: { duration: 30s }
      - analysis:
          templates:
            - templateName: "{{ .Release.Name }}-success-rate-analysis"

# ============================================================================
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ
# ============================================================================

# ============================================================================
# ANALYSIS - настройки проверки здоровья при canary deployment
# ============================================================================
analysis:
  # Включить/выключить создание AnalysisTemplate
  enabled: true

  # Адрес Prometheus сервера
  prometheusAddress: "http://kube-prometheus-stack-prometheus.lesson4356.svc.cluster.local:9090"
  # Порог успешности (0.99 = 99% запросов без 5xx ошибок)
  successThreshold: 0.99

  # Сколько провалов допускается перед rollback
  failureLimit: 3

  # Интервал между проверками
  interval: 30s

  # Количество проверок на каждом шаге canary
  # (3 проверки × 30s = 90 секунд анализа на каждом шаге)
  count: 3


# TODO: дописать probes и resources после доработки rollout.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"


livenessProbe:
  path: /live
  port: 8001
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /ready
  port: 8001
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
