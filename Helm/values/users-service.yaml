# =============================================================================
# VALUES ДЛЯ USERS-SERVICE
# =============================================================================
# Использование:
#   helm install users ../python-service-chart -f users-service.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# ИДЕНТИФИКАЦИЯ СЕРВИСА
# -----------------------------------------------------------------------------
# serviceName — уникальное имя, которое будет использоваться для всех ресурсов:
#   - users-service-rollout (Rollout)
#   - users-service-service (Service)
#   - users-service-config (ConfigMap)
serviceName: users-service

# namespace — в каком namespace создавать ресурсы
namespace: lesson4356

# -----------------------------------------------------------------------------
# DOCKER IMAGE
# -----------------------------------------------------------------------------
# repository — полный путь к образу в registry
# tag — версия образа (рекомендуется использовать конкретную версию, не latest)
image:
  repository: cr.yandex/crpiqtsurn6alildl4cb/users-service
  tag: "2.31"

# -----------------------------------------------------------------------------
# КОЛИЧЕСТВО РЕПЛИК
# -----------------------------------------------------------------------------
# replicaCount — сколько подов будет запущено
# Для production рекомендуется минимум 2 для отказоустойчивости
replicaCount: 2

# -----------------------------------------------------------------------------
# СЕТЕВЫЕ НАСТРОЙКИ (SERVICE)
# -----------------------------------------------------------------------------
# type: ClusterIP — доступ только внутри кластера
# type: NodePort — доступ снаружи через порт на каждой ноде
# type: LoadBalancer — внешний балансировщик (облако)
#
# port — порт Service (по нему обращаются другие сервисы)
# targetPort — порт контейнера (на нём слушает приложение)
# nodePort — внешний порт на нодах (только для NodePort, диапазон 30000-32767)
service:
  type: NodePort
  port: 8003
  targetPort: 8003
  nodePort: 30003

ports:
- name: http-metrics      # ← Имя порта для ServiceMonitor
  port: 8003
  targetPort: 8003
  protocol: TCP
  nodePort: 30003

# -----------------------------------------------------------------------------
# ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ (CONFIGMAP)
# -----------------------------------------------------------------------------
# Все ключи из этой секции станут переменными окружения в контейнере
# Формат: KEY: "value" (значения в кавычках!)
config:
  # Порт на котором запускается приложение
  PORT: "8003"

  # Уровень логирования: DEBUG, INFO, WARNING, ERROR
  LOG_LEVEL: "INFO"

  # Формат логов: json (для машинной обработки) или text (для людей)
  LOG_FORMAT: "json"

  # Включить экспорт метрик Prometheus
  METRICS_ENABLED: "true"

  # URL других сервисов (межсервисное взаимодействие)
  # Формат: http://<service-name>-service:<port>
  ORDERS_SERVICE_URL: "http://orders-service-service:8002"
  REVIEWS_SERVICE_URL: "http://reviews-service-service:8004"

  # Подключение к базе данных
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

# -----------------------------------------------------------------------------
# СЕКРЕТЫ (TODO: требует secret.yaml)
# -----------------------------------------------------------------------------
# Раскомментировать после создания templates/secret.yaml
secret:
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "password"
  POSTGRES_DB: "reviews"

# -----------------------------------------------------------------------------
# CANARY СТРАТЕГИЯ (ARGO ROLLOUTS)
# -----------------------------------------------------------------------------
# Прогрессивная доставка: постепенное увеличение трафика на новую версию
#
# setWeight: 20 — направить 20% трафика на новую версию
# pause: {duration: 30s} — подождать 30 секунд перед следующим шагом
strategy:
  canary:
    steps:
    - setWeight: 20
    - pause: {duration: 30s}
    - analysis:
        templates:
        - templateName: "{{ .Release.Name }}-success-rate-analysis"
    - setWeight: 50
    - pause: {duration: 30s}
    - analysis:
        templates:
        - templateName: "{{ .Release.Name }}-success-rate-analysis"
    - setWeight: 80
    - pause: {duration: 30s}
    - analysis:
        templates:
        - templateName: "{{ .Release.Name }}-success-rate-analysis"

# ============================================================================
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ
# ============================================================================

# ============================================================================
# ANALYSIS - настройки проверки здоровья при canary deployment
# ============================================================================
analysis:
  # Включить/выключить создание AnalysisTemplate
  enabled: true

  # Адрес Prometheus сервера
  prometheusAddress: "http://kube-prometheus-stack-prometheus.lesson4356.svc.cluster.local:9090"
  # Порог успешности (0.99 = 99% запросов без 5xx ошибок)
  successThreshold: 0.99

  # Сколько провалов допускается перед rollback
  failureLimit: 3

  # Интервал между проверками
  interval: 30s

  # Количество проверок на каждом шаге canary
  # (3 проверки × 30s = 90 секунд анализа на каждом шаге)
  count: 3


# -----------------------------------------------------------------------------
# HEALTH CHECKS (TODO: требует доработки rollout.yaml)
# -----------------------------------------------------------------------------
# livenessProbe — проверка "жив ли контейнер"
#   Если проваливается — Kubernetes перезапускает контейнер
#
# readinessProbe — проверка "готов ли принимать трафик"
#   Если проваливается — контейнер исключается из Service
#
# Раскомментировать после доработки rollout.yaml:
livenessProbe:
  path: /live
  port: 8003
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  port: 8003
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6

# -----------------------------------------------------------------------------
# РЕСУРСЫ (TODO: требует доработки rollout.yaml)
# -----------------------------------------------------------------------------
# requests — гарантированные ресурсы (Kubernetes резервирует их)
# limits — максимум (при превышении CPU — throttling, RAM — OOM kill)
#
# Раскомментировать после доработки rollout.yaml:
resources:
  requests:
    memory: "128Mi"    # 128 мебибайт RAM
    cpu: "250m"        # 0.25 CPU (250 миллиядер)
  limits:
    memory: "512Mi"    # Максимум 512 Mi RAM
    cpu: "1000m"       # Максимум 1 CPU

