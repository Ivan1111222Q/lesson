namespace: lesson4356

image:
  repository: cr.yandex/crpiqtsurn6alildl4cb/frontend-service
  tag: "6.0"
  

replicaCount: 1

service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30008

# Убрали многострочный nginx.conf из values.yaml
# Теперь он напрямую в templates/configmap.yaml

livenessProbe:
  path: /health
  port: 80
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  path: /health
  port: 80
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

prometheusScrape: false