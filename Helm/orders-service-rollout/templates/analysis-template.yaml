# ============================================================================
# AnalysisTemplate для Argo Rollouts
# ============================================================================
# Этот шаблон определяет КАК проверять здоровье приложения во время
# canary deployment. Argo Rollouts будет автоматически создавать AnalysisRun
# на основе этого шаблона при каждом шаге деплоя.
#
# Документация: https://argo-rollouts.readthedocs.io/en/stable/features/analysis/
# ============================================================================

{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  # Общий шаблон для всех сервисов
  name: success-rate-analysis
  namespace: {{ .Values.namespace }}
spec:
  # ============================================================================
  # ARGS - параметры шаблона
  # ============================================================================
  # Позволяют переиспользовать один шаблон для разных сервисов
  # При вызове из Rollout можно передать конкретные значения
  args:
    - name: service-name
      # Значение по умолчанию (можно переопределить в Rollout)
      value: "{{ .Chart.Name }}-service"

  # ============================================================================
  # METRICS - список метрик для проверки
  # ============================================================================
  # Можно определить несколько метрик (latency, error rate, custom business metrics)
  # Все метрики должны пройти проверку для успеха Analysis
  metrics:

    # --------------------------------------------------------------------------
    # Метрика 1: Success Rate (процент успешных запросов)
    # --------------------------------------------------------------------------
    - name: success-rate

      # ========================================================================
      # successCondition - УСЛОВИЕ УСПЕХА
      # ========================================================================
      # Выражение на языке expr (https://github.com/antonmedv/expr)
      #
      # result[0] - первый элемент результата Prometheus запроса
      #             (запрос возвращает одно число - процент успешных запросов)
      #
      # >= 0.99 означает: минимум 99% запросов должны быть успешными (без 5xx)
      #
      # Проверяем наличие результата перед доступом к result[0]
      # Если данных нет (len(result) == 0), считаем успехом (1.0 >= threshold)
      #
      # Примеры других условий:
      #   result[0] >= 0.95        - минимум 95% успешных
      #   result[0] <= 0.01        - максимум 1% ошибок
      #   result[0] < 500          - latency меньше 500ms
      # ========================================================================
      successCondition: "result[0] >= {{ .Values.analysis.successThreshold }}"

      # ========================================================================
      # failureLimit - ЛИМИТ ПРОВАЛОВ
      # ========================================================================
      # Сколько раз подряд проверка может провалиться, прежде чем Analysis
      # будет считаться неудачным и произойдёт ROLLBACK
      #
      # failureLimit: 3 означает:
      #   Проверка 1: FAIL (< 99%) - продолжаем
      #   Проверка 2: FAIL         - продолжаем
      #   Проверка 3: FAIL         - ROLLBACK! 🔙
      #
      # Если между провалами есть успех - счётчик сбрасывается
      # ========================================================================
      failureLimit: {{ .Values.analysis.failureLimit }}

      # ========================================================================
      # interval - ИНТЕРВАЛ ПРОВЕРОК
      # ========================================================================
      # Как часто выполнять Prometheus запрос
      #
      # Рекомендации:
      #   - Слишком часто (5s) = нагрузка на Prometheus, шум в данных
      #   - Слишком редко (5m) = медленная реакция на проблемы
      #   - 30s-60s = оптимально для большинства случаев
      # ========================================================================
      interval: {{ .Values.analysis.interval }}

      # ========================================================================
      # count - КОЛИЧЕСТВО ПРОВЕРОК
      # ========================================================================
      # Сколько раз выполнить проверку перед завершением Analysis
      # ОБЯЗАТЕЛЬНО для inline analysis в canary steps!
      #
      # count: 3 означает:
      #   - Выполнить 3 проверки с интервалом 30s
      #   - Если все 3 успешны → Analysis SUCCESS
      #   - Если failureLimit превышен → Analysis FAIL → ROLLBACK
      # ========================================================================
      count: {{ .Values.analysis.count }}

      # ========================================================================
      # provider - ИСТОЧНИК ДАННЫХ
      # ========================================================================
      # Откуда брать метрики для анализа
      #
      # Поддерживаемые провайдеры:
      #   - prometheus    (наш случай)
      #   - datadog
      #   - newRelic
      #   - cloudWatch
      #   - wavefront
      #   - kayenta (Netflix)
      #   - web (HTTP endpoint)
      #   - job (Kubernetes Job)
      # ========================================================================
      provider:
        prometheus:
          # ------------------------------------------------------------------
          # address - адрес Prometheus сервера
          # ------------------------------------------------------------------
          # Формат: http://<service-name>.<namespace>.svc.cluster.local:<port>
          # ------------------------------------------------------------------
          address: {{ .Values.analysis.prometheusAddress | quote }}

          # ==================================================================
          # query - PromQL запрос
          # ==================================================================
          # Prometheus Query Language - язык запросов к метрикам
          #
          # НАША ФОРМУЛА:
          #   (запросы БЕЗ 5xx ошибок) / (ВСЕ запросы) = процент успешных
          #
          # ------------------------------------------------------------------
          # РАЗБОР ЗАПРОСА:
          # ------------------------------------------------------------------
          #
          # ЧИСЛИТЕЛЬ (успешные запросы):
          #   sum(rate(http_requests_total{service="<service-name>", ...filters..., status!~"5.."}[2m]))
          #
          #   http_requests_total - метрика от prometheus_fastapi_instrumentator
          #                         Счётчик всех HTTP запросов к сервису
          #
          #   {service="<service-name>"}
          #       - фильтруем по конкретному сервису (canary или stable)
          #
          #   {handler!~"/metrics|/health|/live|/ready"}
          #       - исключаем служебные эндпоинты (они не отражают бизнес-логику)
          #       - !~ означает "не соответствует regex"
          #
          #   {status!~"5.."}
          #       - исключаем статусы 5xx (500, 502, 503, 504...)
          #       - regex "5.." = начинается с 5, потом любые 2 символа
          #
          #   [2m] - за последние 2 минуты
          #          (окно должно быть больше interval, чтобы данные успели накопиться)
          #
          #   rate() - вычисляет скорость изменения счётчика (запросов в секунду)
          #
          #   sum() - суммируем по всем лейблам (method, handler, status...)
          #
          # ------------------------------------------------------------------
          # ЗНАМЕНАТЕЛЬ (все запросы):
          #   sum(rate(http_requests_total{service="<service-name>", ...filters...}[2m]))
          #
          #   То же самое, но БЕЗ фильтра по status - считаем ВСЕ запросы
          #
          # ------------------------------------------------------------------
          # or vector(1) - если данных нет, возвращаем 1.0 (100% успешность)
          #                Это позволяет canary deployment продолжиться, если
          #                метрики еще не собрались (например, pod только запустился)
          #
          # ------------------------------------------------------------------
          # РЕЗУЛЬТАТ:
          #   Число от 0.0 до 1.0
          #
          #   Пример:
          #     За 2 минуты: 1000 запросов, из них 5 вернули 500
          #     Результат: 995/1000 = 0.995 (99.5%)
          #     0.995 >= 0.99 → SUCCESS ✓
          #
          # ==================================================================
          query: |
            (
              sum(rate(http_requests_total{service="{{`{{`}}args.service-name{{`}}`}}", handler!~"/metrics|/health|/live|/ready", status!~"5.."}[2m]))
              /
              sum(rate(http_requests_total{service="{{`{{`}}args.service-name{{`}}`}}", handler!~"/metrics|/health|/live|/ready"}[2m]))
            ) or vector(1)
{{- end }}

# ============================================================================
# ДОПОЛНИТЕЛЬНЫЕ ПОЛЯ (не используются в этом примере):
# ============================================================================
#
# count: 5
#   - Выполнить ровно 5 проверок и завершить Analysis
#
# initialDelay: 60s
#   - Подождать 60 секунд перед первой проверкой
#
# failureCondition: result[0] > 0.05
#   - Явное условие провала (альтернатива successCondition)
#
# inconclusiveLimit: 3
#   - Лимит "неопределённых" результатов (когда нет данных)
#
# consecutiveErrorLimit: 2
#   - Лимит ошибок выполнения запроса
#
# ============================================================================
