apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: lesson4356
  labels:
    app: grafana
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true