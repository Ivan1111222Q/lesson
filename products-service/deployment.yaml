apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service-deployment
  namespace: lesson4356
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
      - name: products-service
        image: lesson4356-products-service:1.0   
        ports:
        - containerPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: lesson4356
spec:
  selector:
    app: products-service
  type: NodePort
  ports:
    - port      : 8001         # Порт сервиса внутри кластера
      targetPort: 8001         # Порт внутри контейнера
      nodePort  : 30001        # Порт наружу