apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lesson4356
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus/
            - name: rules-volume
              mountPath: /etc/prometheus/rules
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: rules-volume
          configMap:
            name: prometheus-alert-rules

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lesson4356
spec:
  selector:
    app: prometheus
  type: NodePort
  ports:
    - port      : 9090
      targetPort: 9090
      nodePort  : 30090
